<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>MY RECORDS</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header class="hero">

    <div class="hero-overlay"></div>

    <div class="hero-content">

      <p class="eyebrow">
        PERSONAL VINYL ARCHIVE
      </p>

      <h1>
        MY<br>
        RECORDS
      </h1>

      <p class="hero-copy">
        A QUIET PLACE FOR THE MUSIC YOU LOVE.
      </p>

    </div>

  </header>


  <main class="container">

    <!-- CONTROLS -->

    <section class="top-controls">

      <input
        type="search"
        id="searchInput"
        placeholder="アーティスト・アルバムを検索"
      >

      <select id="genreFilter">
        <option value="ALL">ALL GENRES</option>
        <option value="Rock">Rock</option>
        <option value="Alternative">Alternative</option>
        <option value="Indie Rock">Indie Rock</option>
        <option value="Folk">Folk</option>
        <option value="Folk Rock">Folk Rock</option>
        <option value="Punk">Punk</option>
        <option value="Post Punk">Post Punk</option>
        <option value="Emo">Emo</option>
        <option value="Shoegaze">Shoegaze</option>
        <option value="Electronic">Electronic</option>
        <option value="Jazz">Jazz</option>
        <option value="Soul / R&B">Soul / R&B</option>
        <option value="Country">Country</option>
        <option value="Metal">Metal</option>
        <option value="Hip Hop">Hip Hop</option>
        <option value="Other">Other</option>
      </select>

      <button id="openFormButton">
        ＋ ADD RECORD
      </button>

    </section>


    <!-- A-Z -->

    <section class="alphabet-section">

      <div class="alphabet-header">

        <div>
          <p class="small-label">
            INDEX
          </p>

          <h2>
            ARTISTS A—Z
          </h2>
        </div>

        <button
          id="showAllButton"
          class="show-all-button"
        >
          SHOW ALL
        </button>

      </div>

      <div
        id="alphabetNav"
        class="alphabet-nav"
      ></div>

    </section>


    <!-- FORM -->

    <section
      id="recordFormSection"
      class="form-section hidden"
    >

      <div class="form-heading">

        <div>

          <p
            id="formModeLabel"
            class="small-label"
          >
            NEW ENTRY
          </p>

          <h2 id="formTitle">
            ADD RECORD
          </h2>

        </div>

        <button
          type="button"
          id="closeFormButton"
          class="close-button"
        >
          ×
        </button>

      </div>


      <form id="recordForm">

        <div class="form-grid">

          <label>
            ARTIST

            <input
              type="text"
              id="artistInput"
              required
            >
          </label>


          <label>
            ALBUM

            <input
              type="text"
              id="albumInput"
              required
            >
          </label>


          <label>
            GENRE

            <select id="genreInput">
              <option value="Rock">Rock</option>
              <option value="Alternative">Alternative</option>
              <option value="Indie Rock">Indie Rock</option>
              <option value="Folk">Folk</option>
              <option value="Folk Rock">Folk Rock</option>
              <option value="Punk">Punk</option>
              <option value="Post Punk">Post Punk</option>
              <option value="Emo">Emo</option>
              <option value="Shoegaze">Shoegaze</option>
              <option value="Electronic">Electronic</option>
              <option value="Jazz">Jazz</option>
              <option value="Soul / R&B">Soul / R&B</option>
              <option value="Country">Country</option>
              <option value="Metal">Metal</option>
              <option value="Hip Hop">Hip Hop</option>
              <option value="Other">Other</option>
            </select>
          </label>


          <label>
            RATING

            <select id="ratingInput">
              <option value="5">★★★★★</option>
              <option value="4">★★★★☆</option>
              <option value="3">★★★☆☆</option>
              <option value="2">★★☆☆☆</option>
              <option value="1">★☆☆☆☆</option>
            </select>
          </label>

        </div>


        <label>
          MEMO

          <textarea
            id="memoInput"
            rows="4"
            placeholder="お気に入り曲、購入場所、思い出など"
          ></textarea>
        </label>


        <!-- COVER -->

        <div class="cover-search">

          <div class="cover-search-header">

            <div>
              <p class="small-label">
                COVER ART
              </p>

              <h3>
                ジャケットを検索
              </h3>
            </div>

            <button
              type="button"
              id="searchCoverButton"
              class="secondary-button"
            >
              SEARCH COVER
            </button>

          </div>


          <p
            id="currentCoverText"
            class="cover-status"
          ></p>


          <p
            id="coverStatus"
            class="cover-status"
          ></p>


          <div
            id="coverResults"
            class="cover-results"
          ></div>

        </div>


        <input
          type="hidden"
          id="coverUrlInput"
        >


        <div class="form-actions">

          <button
            type="submit"
            id="saveButton"
            class="save-button"
          >
            SAVE RECORD
          </button>

          <button
            type="button"
            id="cancelButton"
            class="cancel-button"
          >
            CANCEL
          </button>

        </div>

      </form>

    </section>


    <!-- COLLECTION -->

    <section class="collection-section">

      <div class="collection-header">

        <div>
          <p class="small-label">
            COLLECTION
          </p>

          <h2>
            RECORDS
          </h2>
        </div>

        <span id="recordCount">
          0 RECORDS
        </span>

      </div>


      <div
        id="recordList"
        class="artist-groups"
      ></div>

    </section>

  </main>


  <footer>

    <p>
      MY RECORDS
    </p>

    <p>
      PERSONAL VINYL ARCHIVE
    </p>

  </footer>


  <script src="script.js"></script>

</body>
</html>
